{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="text-center text-primary mb-4">Forgot Password</h2>
        <p class="text-muted text-center">Enter your email to receive password reset instructions.</p>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
        </form>
        <p class="text-center mt-3 mb-0"><a href="{{ url_for('auth.login') }}">Back to Login</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
