{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
          <div>
            <p class="text-uppercase small fw-semibold text-primary mb-1">Administrator provisioning</p>
            <h2 class="mb-1">Create HoD Account</h2>
            <p class="text-muted mb-0">Create a secure account for the Head of the Department.</p>
          </div>
          <span class="badge bg-primary fs-6">HoD</span>
        </div>

        <form method="post" action="{{ url_for('admin.create_hod_account') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="hod-name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="hod-name" name="name" value="{{ name or '' }}" maxlength="120" required>
          </div>
          <div class="mb-3">
            <label for="hod-email" class="form-label">Email</label>
            <input type="email" class="form-control" id="hod-email" name="email" value="{{ email or '' }}" maxlength="120" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label for="hod-password" class="form-label">Temporary Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="hod-password" name="password" minlength="12" autocomplete="new-password" required>
              <button type="button" class="btn btn-outline-secondary" data-toggle-password data-target="hod-password">Show</button>
            </div>
            <small class="form-text">Use at least 12 characters. The HoD should change it through the account process.</small>
          </div>
          <div class="mb-4">
            <label for="hod-password-confirmation" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="hod-password-confirmation" name="password_confirmation" minlength="12" autocomplete="new-password" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Create HoD Account</button>
            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
